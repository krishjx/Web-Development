 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Business On Internet | Digital Marketing & SEO Agency</title>

  <meta
    name="description"
    content="Business On Internet helps businesses grow online through SEO, PPC advertising, social media marketing, web development and digital strategy."
  >

  <meta
    name="keywords"
    content="digital marketing, SEO, PPC, Google Ads, social media marketing, web development, local SEO, India"
  >

  <meta name="author" content="Business On Internet">

  <meta property="og:title"
        content="Business On Internet | Digital Growth Agency">

  <meta property="og:description"
        content="SEO, PPC, social media and digital growth solutions for modern businesses.">

  <meta property="og:type" content="website">

  <meta name="theme-color" content="#08111f">

  <style>

    /* =========================================================
       ROOT
    ========================================================= */

    :root {
      --bg: #07111f;
      --bg-2: #0b1728;
      --surface: #101e31;
      --surface-2: #14253c;

      --primary: #6c63ff;
      --primary-2: #8b7cff;
      --cyan: #2dd4bf;

      --text: #f7f9fc;
      --muted: #9eacc0;

      --border: rgba(255,255,255,.09);

      --white: #ffffff;

      --success: #35d07f;
      --warning: #ffc857;

      --radius-sm: 10px;
      --radius-md: 18px;
      --radius-lg: 28px;

      --container: 1180px;

      --shadow:
        0 25px 80px rgba(0,0,0,.28);

      --transition:
        180ms ease;
    }


    /* =========================================================
       RESET
    ========================================================= */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(108,99,255,.12),
          transparent 28%
        ),
        radial-gradient(
          circle at 85% 15%,
          rgba(45,212,191,.08),
          transparent 25%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      line-height: 1.6;
      overflow-x: hidden;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    ul {
      list-style: none;
    }


    /* =========================================================
       ACCESSIBILITY
    ========================================================= */

    .skip-link {
      position: fixed;
      left: 16px;
      top: -100px;
      z-index: 9999;

      background: var(--white);
      color: #000;

      padding: 12px 18px;
      border-radius: 8px;
    }

    .skip-link:focus {
      top: 16px;
    }

    :focus-visible {
      outline: 3px solid var(--cyan);
      outline-offset: 4px;
    }


    /* =========================================================
       UTILITIES
    ========================================================= */

    .container {
      width: min(
        calc(100% - 40px),
        var(--container)
      );

      margin-inline: auto;
    }

    .section {
      padding: 110px 0;
    }

    .section-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      color: var(--cyan);

      font-size: .78rem;
      font-weight: 800;

      letter-spacing: .14em;
      text-transform: uppercase;

      margin-bottom: 16px;
    }

    .section-label::before {
      content: "";
      width: 26px;
      height: 2px;
      background: var(--cyan);
    }

    .section-title {
      max-width: 760px;

      font-size:
        clamp(2rem, 5vw, 3.5rem);

      line-height: 1.05;
      letter-spacing: -.04em;

      margin-bottom: 18px;
    }

    .section-description {
      max-width: 650px;
      color: var(--muted);
      font-size: 1.05rem;
    }


    /* =========================================================
       HEADER
    ========================================================= */

    .site-header {
      position: fixed;
      left: 0;
      right: 0;
      top: 0;

      z-index: 1000;

      border-bottom: 1px solid transparent;

      transition:
        background var(--transition),
        border-color var(--transition),
        backdrop-filter var(--transition);
    }

    .site-header.scrolled {
      background: rgba(7,17,31,.84);
      backdrop-filter: blur(18px);
      border-color: var(--border);
    }

    .nav {
      min-height: 78px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;

      font-weight: 900;
      letter-spacing: -.03em;
    }

    .brand-mark {
      width: 38px;
      height: 38px;

      display: grid;
      place-items: center;

      border-radius: 11px;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--cyan)
        );

      color: white;
      font-size: 18px;
    }

    .brand span:last-child {
      font-size: 1.05rem;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .nav-links a {
      color: var(--muted);
      font-size: .92rem;
      font-weight: 600;

      transition: color var(--transition);
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--white);
    }

    .nav-cta {
      padding: 11px 17px;

      background: var(--white);
      color: #08111f !important;

      border-radius: 10px;
    }

    .menu-button {
      display: none;

      border: 1px solid var(--border);
      background: var(--surface);

      color: var(--white);

      width: 44px;
      height: 44px;

      border-radius: 10px;
    }


    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      position: relative;

      min-height: 100vh;

      display: grid;
      align-items: center;

      padding-top: 130px;
      padding-bottom: 80px;
    }

    .hero-grid {
      display: grid;

      grid-template-columns:
        1.05fr
        .95fr;

      gap: 70px;
      align-items: center;
    }

    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;

      padding: 7px 12px;

      border: 1px solid var(--border);
      background: rgba(255,255,255,.035);

      border-radius: 999px;

      color: #cbd5e1;

      font-size: .8rem;
      font-weight: 700;

      margin-bottom: 22px;
    }

    .live-dot {
      width: 7px;
      height: 7px;

      background: var(--success);
      border-radius: 50%;

      box-shadow:
        0 0 0 5px rgba(53,208,127,.1);
    }

    .hero h1 {
      max-width: 780px;

      font-size:
        clamp(3rem, 7vw, 6.5rem);

      line-height: .92;

      letter-spacing: -.065em;

      margin-bottom: 26px;
    }

    .gradient-text {
      background:
        linear-gradient(
          100deg,
          #fff 10%,
          #a8a2ff 50%,
          #57e5d1 100%
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }

    .hero-copy {
      max-width: 650px;

      color: var(--muted);

      font-size: 1.12rem;

      margin-bottom: 32px;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 13px;

      flex-wrap: wrap;
    }

    .button {
      min-height: 48px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      gap: 9px;

      padding: 0 20px;

      border-radius: 11px;

      border: 1px solid transparent;

      font-weight: 800;
      font-size: .9rem;

      transition:
        transform var(--transition),
        background var(--transition),
        border-color var(--transition);
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .button-primary {
      background: var(--primary);
      color: white;

      box-shadow:
        0 15px 40px rgba(108,99,255,.28);
    }

    .button-primary:hover {
      background: var(--primary-2);
    }

    .button-secondary {
      background: rgba(255,255,255,.035);
      border-color: var(--border);
    }

    .button-secondary:hover {
      background: rgba(255,255,255,.07);
    }


    /* =========================================================
       HERO DASHBOARD
    ========================================================= */

    .hero-visual {
      position: relative;
    }

    .dashboard {
      position: relative;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.075),
          rgba(255,255,255,.025)
        );

      border: 1px solid var(--border);

      border-radius: var(--radius-lg);

      padding: 20px;

      box-shadow: var(--shadow);

      overflow: hidden;
    }

    .dashboard::before {
      content: "";

      position: absolute;

      width: 260px;
      height: 260px;

      right: -100px;
      top: -120px;

      background: var(--primary);

      filter: blur(90px);

      opacity: .25;
    }

    .dashboard-top {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .dashboard-title {
      font-size: .9rem;
      font-weight: 800;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      color: var(--success);

      font-size: .75rem;
      font-weight: 800;
    }

    .status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 12px;

      margin-top: 16px;
    }

    .metric {
      background: rgba(255,255,255,.045);
      border: 1px solid var(--border);

      padding: 17px;
      border-radius: 15px;
    }

    .metric-label {
      color: var(--muted);
      font-size: .72rem;
      margin-bottom: 5px;
    }

    .metric-value {
      font-size: 1.55rem;
      font-weight: 900;
      letter-spacing: -.04em;
    }

    .metric-change {
      color: var(--success);
      font-size: .72rem;
      font-weight: 700;
    }

    .chart {
      height: 190px;

      margin-top: 15px;

      border: 1px solid var(--border);
      border-radius: 15px;

      padding: 15px;

      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 37px,
          rgba(255,255,255,.045) 38px
        );
    }

    .chart svg {
      width: 100%;
      height: 100%;
    }


    /* =========================================================
       TRUST BAR
    ========================================================= */

    .trust {
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);

      background: rgba(255,255,255,.018);
    }

    .trust-grid {
      min-height: 115px;

      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 20px;

      align-items: center;
    }

    .trust-item {
      text-align: center;
    }

    .trust-number {
      display: block;

      font-size: 2rem;
      line-height: 1;

      font-weight: 900;

      letter-spacing: -.05em;
    }

    .trust-label {
      display: block;

      color: var(--muted);

      font-size: .78rem;
      margin-top: 7px;
    }


    /* =========================================================
       SERVICES
    ========================================================= */

    .services-grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 17px;

      margin-top: 55px;
    }

    .service-card {
      position: relative;

      padding: 27px;

      min-height: 250px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.055),
          rgba(255,255,255,.018)
        );

      border: 1px solid var(--border);

      border-radius: var(--radius-md);

      transition:
        transform var(--transition),
        border-color var(--transition),
        background var(--transition);
    }

    .service-card:hover {
      transform: translateY(-6px);

      border-color:
        rgba(108,99,255,.55);

      background:
        linear-gradient(
          145deg,
          rgba(108,99,255,.10),
          rgba(255,255,255,.025)
        );
    }

    .service-icon {
      width: 46px;
      height: 46px;

      display: grid;
      place-items: center;

      border-radius: 13px;

      background:
        rgba(108,99,255,.12);

      color: #aaa4ff;

      margin-bottom: 22px;

      font-size: 20px;
    }

    .service-card h3 {
      font-size: 1.15rem;
      margin-bottom: 10px;
    }

    .service-card p {
      color: var(--muted);
      font-size: .9rem;
    }

    .service-arrow {
      position: absolute;

      right: 22px;
      bottom: 21px;

      color: var(--cyan);
    }


    /* =========================================================
       ABOUT
    ========================================================= */

    .about-grid {
      display: grid;

      grid-template-columns: .8fr 1.2fr;

      gap: 70px;

      align-items: center;
    }

    .about-card {
      padding: 35px;

      border: 1px solid var(--border);

      border-radius: var(--radius-lg);

      background:
        linear-gradient(
          145deg,
          rgba(108,99,255,.11),
          rgba(255,255,255,.025)
        );
    }

    .about-stat {
      font-size: 5rem;
      font-weight: 900;
      line-height: .9;

      letter-spacing: -.08em;

      margin-bottom: 15px;
    }

    .about-card p {
      color: var(--muted);
    }

    .about-copy p {
      color: var(--muted);

      margin-bottom: 20px;
    }

    .check-list {
      display: grid;
      gap: 13px;

      margin-top: 28px;
    }

    .check-list li {
      display: flex;
      gap: 11px;

      color: #dbe4ef;

      font-size: .92rem;
    }

    .check-list li::before {
      content: "✓";

      flex: 0 0 auto;

      width: 21px;
      height: 21px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      background: rgba(53,208,127,.12);
      color: var(--success);

      font-size: .75rem;
      font-weight: 900;
    }


    /* =========================================================
       PROCESS
    ========================================================= */

    .process {
      background: var(--bg-2);
      border-block: 1px solid var(--border);
    }

    .process-grid {
      display: grid;

      grid-template-columns:
        repeat(4,1fr);

      gap: 14px;

      margin-top: 50px;
    }

    .process-card {
      padding: 25px;

      border: 1px solid var(--border);

      border-radius: var(--radius-md);

      background: rgba(255,255,255,.025);
    }

    .process-number {
      color: var(--primary-2);

      font-size: .8rem;
      font-weight: 900;

      margin-bottom: 35px;
    }

    .process-card h3 {
      margin-bottom: 8px;
    }

    .process-card p {
      color: var(--muted);
      font-size: .88rem;
    }


    /* =========================================================
       PORTFOLIO
    ========================================================= */

    .portfolio-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;

      margin-top: 38px;
      margin-bottom: 25px;
    }

    .filter-button {
      border: 1px solid var(--border);

      background: rgba(255,255,255,.025);

      color: var(--muted);

      padding: 9px 14px;

      border-radius: 9px;

      font-size: .8rem;
      font-weight: 700;
    }

    .filter-button.active,
    .filter-button:hover {
      color: white;
      background: var(--primary);
      border-color: var(--primary);
    }

    .portfolio-grid {
      display: grid;

      grid-template-columns:
        repeat(3,1fr);

      gap: 16px;
    }

    .portfolio-card {
      overflow: hidden;

      border: 1px solid var(--border);
      border-radius: var(--radius-md);

      background: var(--surface);

      transition: transform var(--transition);
    }

    .portfolio-card:hover {
      transform: translateY(-5px);
    }

    .portfolio-image {
      min-height: 190px;

      display: flex;
      align-items: end;

      padding: 20px;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(108,99,255,.65),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #162d4b,
          #08111f
        );
    }

    .portfolio-image span {
      padding: 6px 10px;

      border-radius: 7px;

      background: rgba(0,0,0,.35);

      font-size: .7rem;
      font-weight: 800;
    }

    .portfolio-info {
      padding: 19px;
    }

    .portfolio-info h3 {
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .portfolio-info p {
      color: var(--muted);
      font-size: .78rem;
    }


    /* =========================================================
       PRICING
    ========================================================= */

    .pricing {
      background: var(--bg-2);
      border-block: 1px solid var(--border);
    }

    .pricing-grid {
      display: grid;

      grid-template-columns:
        repeat(3,1fr);

      gap: 16px;

      margin-top: 50px;
    }

    .price-card {
      padding: 30px;

      border: 1px solid var(--border);

      border-radius: var(--radius-lg);

      background:
        rgba(255,255,255,.025);
    }

    .price-card.featured {
      border-color: var(--primary);

      background:
        linear-gradient(
          145deg,
          rgba(108,99,255,.13),
          rgba(255,255,255,.025)
        );

      transform: translateY(-10px);
    }

    .price-badge {
      display: inline-block;

      padding: 5px 9px;

      border-radius: 6px;

      background: rgba(108,99,255,.16);
      color: #b5afff;

      font-size: .68rem;
      font-weight: 800;

      margin-bottom: 17px;
    }

    .price-card h3 {
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .price {
      font-size: 3rem;

      line-height: 1;

      font-weight: 900;

      letter-spacing: -.06em;

      margin-bottom: 6px;
    }

    .price small {
      color: var(--muted);

      font-size: .8rem;
      font-weight: 500;

      letter-spacing: 0;
    }

    .price-description {
      color: var(--muted);

      min-height: 48px;

      font-size: .82rem;

      margin: 15px 0 20px;
    }

    .features {
      display: grid;
      gap: 12px;

      margin: 25px 0;
    }

    .features li {
      display: flex;
      gap: 9px;

      color: #d3dce8;

      font-size: .82rem;
    }

    .features li::before {
      content: "✓";
      color: var(--success);
      font-weight: 900;
    }

    .full-button {
      width: 100%;
    }


    /* =========================================================
       TESTIMONIAL
    ========================================================= */

    .testimonial {
      max-width: 820px;

      margin: 50px auto 0;

      padding: 45px;

      border: 1px solid var(--border);

      border-radius: var(--radius-lg);

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.055),
          rgba(255,255,255,.015)
        );

      text-align: center;
    }

    .quote-mark {
      color: var(--primary-2);

      font-size: 4rem;

      line-
