<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0E0C0B">

  <meta name="description"
        content="A beautiful collection of Prateek's wedding memories — Haldi, Mehndi, Sangeet, Wedding, Reception and family highlights.">

  <meta property="og:title" content="Prateek's Wedding | Family Memories">
  <meta property="og:description"
        content="A Celebration to Remember — Prateek's Wedding • Family Memories • 2025">
  <meta property="og:type" content="website">

  <title>Prateek's Wedding | Family Memories</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet">

  <style>
    /* =========================================================
       DESIGN SYSTEM
    ========================================================= */

    :root {
      --bg: #0e0c0b;
      --surface: #171311;
      --surface-light: #211c19;

      --text: #f4efe7;
      --muted: #afa69b;

      --accent: #c9a46c;
      --rose: #8d6661;

      --border: rgba(244, 239, 231, 0.12);

      --serif: "Playfair Display", serif;
      --display: "Cormorant Garamond", serif;
      --sans: "Inter", sans-serif;

      --container: 1240px;

      --transition: 0.4s cubic-bezier(.2,.7,.2,1);
    }

    /* =========================================================
       RESET
    ========================================================= */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.7;
      overflow-x: hidden;
    }

    body.menu-open {
      overflow: hidden;
    }

    img {
      display: block;
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    ::selection {
      background: var(--accent);
      color: var(--bg);
    }

    /* =========================================================
       UTILITIES
    ========================================================= */

    .container {
      width: min(calc(100% - 40px), var(--container));
      margin-inline: auto;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .section {
      padding: 130px 0;
      position: relative;
    }

    .section-heading {
      max-width: 750px;
      margin-bottom: 65px;
    }

    .section-title {
      font-family: var(--serif);
      font-size: clamp(2.6rem, 5vw, 5rem);
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: -0.035em;
      margin-top: 15px;
    }

    .section-subtitle {
      color: var(--muted);
      max-width: 650px;
      margin-top: 20px;
      font-size: 1rem;
    }

    /* =========================================================
       LOADING SCREEN
    ========================================================= */

    .loader {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: grid;
      place-items: center;

      background: var(--bg);

      transition:
        opacity 0.8s ease,
        visibility 0.8s ease;
    }

    .loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-content {
      text-align: center;
    }

    .loader-small {
      color: var(--accent);
      font-size: 0.65rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    .loader-title {
      font-family: var(--serif);
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 400;
    }

    .loader-line {
      width: 80px;
      height: 1px;
      background: var(--accent);
      margin: 25px auto 0;
      transform-origin: left;
      animation: loaderLine 1.2s ease forwards;
    }

    @keyframes loaderLine {
      from {
        transform: scaleX(0);
      }

      to {
        transform: scaleX(1);
      }
    }

    /* =========================================================
       NAVIGATION
    ========================================================= */

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;

      padding: 22px 0;

      transition:
        background var(--transition),
        backdrop-filter var(--transition),
        padding var(--transition);
    }

    .navbar.scrolled {
      padding: 14px 0;
      background: rgba(14, 12, 11, 0.82);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.18em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 35px;
    }

    .nav-link {
      position: relative;
      color: rgba(244,239,231,.72);
      font-size: 0.76rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: color var(--transition);
    }

    .nav-link::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -7px;
      width: 100%;
      height: 1px;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: right;
      transition: transform var(--transition);
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--text);
    }

    .nav-link:hover::after,
    .nav-link.active::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    .menu-button {
      display: none;
      border: 0;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      width: 42px;
      height: 42px;
    }

    .menu-icon,
    .menu-icon::before,
    .menu-icon::after {
      display: block;
      width: 22px;
      height: 1px;
      background: var(--text);
      transition: var(--transition);
    }

    .menu-icon {
      position: relative;
      margin: auto;
    }

    .menu-icon::before,
    .menu-icon::after {
      content: "";
      position: absolute;
      left: 0;
    }

    .menu-icon::before {
      top: -7px;
    }

    .menu-icon::after {
      top: 7px;
    }

    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      min-height: 100svh;
      position: relative;
      display: flex;
      align-items: center;

      background:
        linear-gradient(
          90deg,
          rgba(14,12,11,.86) 0%,
          rgba(14,12,11,.55) 45%,
          rgba(14,12,11,.4) 100%
        ),
        url("assets/hero.jpg") center/cover no-repeat;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          circle at center,
          transparent 25%,
          rgba(0,0,0,.5) 100%
        );

      pointer-events: none;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;

      opacity: .08;
      pointer-events: none;

      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 850px;
      padding-top: 70px;
    }

    .hero-title {
      font-family: var(--serif);
      font-size: clamp(3.5rem, 9vw, 8.5rem);
      font-weight: 500;
      line-height: .9;
      letter-spacing: -0.055em;
      margin: 20px 0 28px;
    }

    .hero-description {
      max-width: 610px;
      color: rgba(244,239,231,.78);
      font-size: clamp(.95rem, 2vw, 1.1rem);
    }

    .hero-name {
      margin-top: 25px;
      font-family: var(--display);
      color: var(--accent);
      font-size: 1.5rem;
      letter-spacing: .08em;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 35px;
    }

    /* =========================================================
       BUTTONS
    ========================================================= */

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;

      min-height: 52px;
      padding: 0 25px;

      border: 1px solid rgba(244,239,231,.25);

      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;

      transition:
        background var(--transition),
        color var(--transition),
        border-color var(--transition),
        transform var(--transition);
    }

    .btn-primary {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    .btn-primary:hover {
      background: var(--accent);
      border-color: var(--accent);
    }

    .btn-outline:hover {
      background: rgba(244,239,231,.08);
      border-color: var(--accent);
    }

    .arrow {
      transition: transform var(--transition);
    }

    .btn:hover .arrow {
      transform: translateX(5px);
    }

    .scroll-indicator {
      position: absolute;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;

      color: var(--muted);
      font-size: .6rem;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .scroll-line {
      width: 1px;
      height: 55px;
      background: linear-gradient(
        to bottom,
        var(--accent),
        transparent
      );
      animation: scrollPulse 2s infinite;
    }

    @keyframes scrollPulse {
      0%, 100% {
        opacity: .3;
        transform: scaleY(.6);
        transform-origin: top;
      }

      50% {
        opacity: 1;
        transform: scaleY(1);
      }
    }

    /* =========================================================
       INTRODUCTION
    ========================================================= */

    .intro {
      background: var(--bg);
    }

    .intro-grid {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 80px;
      align-items: end;
    }

    .intro-text {
      font-family: var(--display);
      color: var(--muted);
      font-size: clamp(1.3rem, 2.5vw, 2rem);
      line-height: 1.5;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .stat {
      padding: 35px 20px;
      text-align: center;
      border-right: 1px solid var(--border);
    }

    .stat:last-child {
      border-right: 0;
    }

    .stat-number {
      font-family: var(--serif);
      color: var(--accent);
      font-size: clamp(2.2rem, 4vw, 3.5rem);
      line-height: 1;
    }

    .stat-label {
      margin-top: 10px;
      color: var(--muted);
      font-size: .7rem;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    /* =========================================================
       COLLECTION CTA
    ========================================================= */

    .collection-wrap {
      padding: 0 0 130px;
    }

    .collection-card {
      position: relative;
      overflow: hidden;

      padding: clamp(35px, 6vw, 70px);

      border: 1px solid rgba(201,164,108,.35);

      background:
        linear-gradient(
          120deg,
          rgba(201,164,108,.12),
          rgba(141,102,97,.08),
          rgba(255,255,255,.02)
        );

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 40px;
    }

    .collection-card::before {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      right: -100px;
      top: -120px;
      border-radius: 50%;
      background: rgba(201,164,108,.12);
      filter: blur(50px);
    }

    .collection-title {
      font-family: var(--serif);
      font-size: clamp(2rem, 4vw, 3.5rem);
      font-weight: 500;
    }

    .collection-text {
      color: var(--muted);
      margin-top: 10px;
      max-width: 650px;
    }

    /* =========================================================
       TIMELINE
    ========================================================= */

    .timeline {
      position: relative;
      max-width: 900px;
      margin: auto;
    }

    .timeline::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1px;
      background: linear-gradient(
        to bottom,
        transparent,
        var(--accent),
        transparent
      );
    }

    .timeline-item {
      position: relative;
      width: 50%;
      padding: 25px 55px;
    }

    .timeline-item:nth-child(odd) {
      left: 0;
      text-align: right;
    }

    .timeline-item:nth-child(even) {
      left: 50%;
    }

    .timeline-dot {
      position: absolute;
      top: 38px;
      width: 12px;
      height: 12px;

      border: 2px solid var(--accent);
      border-radius: 50%;
      background: var(--bg);
    }

    .timeline-item:nth-child(odd) .timeline-dot {
      right: -6px;
    }

    .timeline-item:nth-child(even) .timeline-dot {
      left: -6px;
    }

    .timeline-number {
      color: var(--accent);
      font-size: .7rem;
      letter-spacing: .15em;
    }

    .timeline-title {
      font-family: var(--serif);
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 500;
      margin: 5px 0;
    }

    .timeline-description {
      color: var(--muted);
      font-size: .9rem;
      margin-bottom: 15px;
    }

    .timeline-link {
      color: var(--text);
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .timeline-link:hover {
      color: var(--accent);
    }

    /* =========================================================
       ALBUM GALLERY
    ========================================================= */

    .albums {
      background: var(--surface);
    }

    .album-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .album-card {
      position: relative;
      min-height: 500px;
      overflow: hidden;
      border: 1px solid var(--border);
      isolation: isolate;
    }

    .album-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
      transition: transform .8s cubic-bezier(.2,.7,.2,1);
    }

    .album-card::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;

      background:
        linear-gradient(
          to top,
          rgba(0,0,0,.9) 0%,
          rgba(0,0,0,.25) 55%,
          rgba(0,0,0,.1) 100%
        );
    }

    .album-card:hover .album-image {
      transform: scale(1.06);
    }

    .album-content {
      position: absolute;
      inset: auto 0 0;
      padding: 35px;
    }

    .album-number {
      color: var(--accent);
      font-size: .65rem;
      letter-spacing: .2em;
    }

    .album-title {
      margin: 7px 0;
      font-family: var(--serif);
      font-size: clamp(2rem, 4vw, 3.2rem);
      font-weight: 500;
    }

    .album-description {
      max-width: 450px;
      color: rgba(244,239,231,.72);
      font-size: .85rem;
      margin-bottom: 20px;
    }

    .album-link {
      display: inline-flex;
      gap: 10px;
      align-items: center;

      color: var(--text);
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .album-link span {
      transition: transform var(--transition);
    }

    .album-link:hover {
      color: var(--accent);
    }

    .album-link:hover span {
      transform: translate(4px,-4px);
    }

    /* =========================================================
       MEMORY MOSAIC
    ========================================================= */

    .mosaic {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-auto-rows: 110px;
      gap: 12px;
    }

    .mosaic-item {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .mosaic-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .8s cubic-bezier(.2,.7,.2,1);
    }

    .mosaic-item:hover img {
      transform: scale(1.07);
    }

    .mosaic-item:nth-child(1) {
      grid-column: span 5;
      grid-row: span 4;
    }

    .mosaic-item:nth-child(2) {
      grid-column: span 4;
      grid-row: span 3;
    }

    .mosaic-item:nth-child(3) {
      grid-column: span 3;
      grid-row: span 4;
    }

    .mosaic-item:nth-child(4) {
      grid-column: span 4;
      grid-row: span 4;
    }

    .mosaic-item:nth-child(5) {
      grid-column: span 4;
      grid-row: span 3;
    }

    .mosaic-item:nth-child(6) {
      grid-column: span 4;
      grid-row: span 4;
    }

    .mosaic-item:nth-child(7) {
      grid-column: span 3;
      grid-row: span 4;
    }

    .mosaic-item:nth-child(8) {
      grid-column: span 5;
      grid-row: span 3;
    }

    .mosaic-item:nth-child(9) {
      grid-column: span 4;
      grid-row: span 4;
    }

    .mosaic-item:nth-child(10) {
      grid-column: span 4;
      grid-row: span 3;
    }

    .mosaic-item:nth-child(11) {
      grid-column: span 4;
      grid-row: span 3;
    }

    .mosaic-item:nth-child(12) {
      grid-column: span 4;
      grid-row: span 4;
    }

    /* =========================================================
       QUOTE
    ========================================================= */

    .quote-section {
      min-height: 65vh;
      display: grid;
      place-items: center;
      text-align: center;

      background:
        radial-gradient(
          circle at center,
          rgba(141,102,97,.16),
          transparent 55%
        ),
        var(--bg);
    }

    .quote-mark {
      color: var(--accent);
      font-family: var(--display);
      font-size: 6rem;
      line-height: .5;
    }

    .quote {
      max-width: 1000px;
      margin: 30px auto;
      font-family: var(--serif);
      font-size: clamp(2.4rem, 5vw, 5rem);
      font-weight: 400;
      line-height: 1.1;
    }

    .quote-author {
      color: var(--muted);
      font-family: var(--display);
      font-size: 1.4rem;
    }

    /* =========================================================
       FAMILY MESSAGE
    ========================================================= */

    .message {
      max-width: 800px;
      margin: auto;
      text-align: center;
    }

    .message-text {
      margin-top: 30px;
      color: var(--muted);
      font-family: var(--display);
      font-size: clamp(1.3rem, 3vw, 2rem);
      line-height: 1.55;
    }

    .message-heart {
      display: block;
      margin-top: 30px;
      color: var(--rose);
      font-size: 1.5rem;
    }

    /* =========================================================
       FINAL CTA
    ========================================================= */

    .final-cta {
      position: relative;
      overflow: hidden;
      text-alig
